name: tag_music
description: 双端本地音乐播放器。
publish_to: none
version: 0.7.0+57

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  shared_preferences: 2.5.6
  package_info_plus: 10.2.2
  media_kit: 1.2.6
  media_kit_libs_audio: 1.0.7
  audio_service: 0.18.19
  audio_session: 0.2.4
  audio_metadata_reader: 1.8.1
  file_selector: 1.1.0
  ffi: 2.2.0
  drift: 2.35.3
  drift_flutter: 0.3.1
  path_provider: 2.1.6
  uuid: 4.6.0
  path: 1.9.1
  crypto: 3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.2
  build_runner: 2.17.1
  sqlite3: 3.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/native/
    - assets/windows_app_icon.png
