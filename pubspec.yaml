name: tag_music
description: 双端本地音乐播放器。
publish_to: none
version: 0.2.0+9

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  shared_preferences: 2.5.6
  package_info_plus: 10.2.2
  media_kit: 1.2.6
  media_kit_libs_audio: 1.0.7
  audio_service: 0.18.19
  audio_session: 0.2.4
  audio_metadata_reader: 1.8.1
  file_selector: 1.1.0
  ffi: 2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/native/
